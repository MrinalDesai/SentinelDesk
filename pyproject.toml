[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentineldesk"
version = "0.1.0-dev"
description = "Agentic ITSM ticket routing and resolution (NASSCOM Agentic AI Hackathon 2026)"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
