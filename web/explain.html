<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SentinelDesk — Explain</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0b0f14;--panel:#111821;--panel2:#0e141b;--line:#1e2a36;--ink:#e6edf3;
    --mute:#8a9aaa;--dim:#55677a;--signal:#3ddc84;--amber:#ffb454;--red:#ff5d5d;--blue:#5db4ff;--violet:#b48cff;
    --mono:'JetBrains Mono',monospace;--display:'Fraunces',serif;}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:13px;
    background-image:radial-gradient(circle at 50% -8%,rgba(61,220,132,.06),transparent 45%);}
  header{padding:20px 28px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  header h1{font-family:var(--display);font-size:24px;font-weight:900;letter-spacing:-.02em}
  header h1 em{color:var(--signal);font-style:italic}
  header .sub{color:var(--mute);font-size:12px}
  .controls{margin-left:auto;display:flex;gap:10px;align-items:center}
  .tabs a{font-size:11px;color:var(--mute);text-decoration:none;border:1px solid var(--line);border-radius:7px;padding:6px 11px}
  .tabs a:hover{border-color:var(--signal);color:var(--signal)}
  .run{background:var(--signal);color:#063;border:none;border-radius:8px;padding:9px 18px;font-family:var(--mono);font-size:12px;font-weight:700;cursor:pointer}
  .run:disabled{opacity:.5}
  .stage{max-width:920px;margin:0 auto;padding:26px 24px 80px}
  .ticketbar{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin-bottom:8px}
  .ticketbar .lbl{font-size:10px;letter-spacing:.25em;color:var(--signal);text-transform:uppercase}
  .ticketbar input{width:100%;background:transparent;border:none;color:var(--ink);font-family:var(--mono);font-size:14px;margin-top:6px;outline:none}
  .quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .quick button{background:var(--panel2);border:1px solid var(--line);color:var(--mute);border-radius:14px;padding:5px 12px;font-size:11px;cursor:pointer}
  .quick button:hover{border-color:var(--signal);color:var(--signal)}

  /* the query canvas with glowing words */
  .canvas{background:#070b0f;border:1px solid var(--line);border-radius:14px;padding:30px;margin:20px 0;
    font-size:20px;line-height:2.1;font-family:var(--display);min-height:120px}
  .w{display:inline-block;padding:2px 6px;margin:1px;border-radius:6px;transition:all .5s;color:var(--mute)}
  .w.freq{color:#fff;background:rgba(93,180,255,.15);box-shadow:0 0 0 1px var(--blue),0 0 22px rgba(93,180,255,.5);transform:translateY(-2px)}
  .w.uniq{color:#fff;background:rgba(61,220,132,.16);box-shadow:0 0 0 1px var(--signal),0 0 26px rgba(61,220,132,.6);transform:translateY(-3px) scale(1.05)}
  .w.layman{color:#fff;background:rgba(255,180,84,.14);box-shadow:0 0 0 1px var(--amber),0 0 20px rgba(255,180,84,.5)}

  .legend{display:flex;gap:18px;font-size:11px;color:var(--dim);margin-bottom:6px}
  .legend span b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px;
    opacity:0;transform:translateY(8px);transition:.5s}
  .panel.in{opacity:1;transform:none}
  .panel h3{font-family:var(--display);font-size:16px;font-weight:600;margin-bottom:8px}
  .panel .b{font-size:12.5px;color:var(--mute);line-height:1.7}
  .panel .b .k{color:var(--blue)} .panel .b .g{color:var(--signal)} .panel .b .a{color:var(--amber)}
  .chip{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:3px 10px;margin:3px;font-size:11px}
  .chip.uniq{border-color:var(--signal);color:var(--signal)} .chip.freq{border-color:var(--blue);color:var(--blue)} .chip.layman{border-color:var(--amber);color:var(--amber)}

  pre{background:#070b0f;border:1px solid var(--line);border-radius:8px;padding:14px;font-size:11.5px;white-space:pre-wrap;color:var(--mute);line-height:1.6}
  pre .ev{color:var(--signal)}

  .scores .row{display:flex;align-items:center;gap:10px;margin-bottom:6px;font-size:12px}
  .scores .nm{width:150px;color:var(--mute)} .scores .track{flex:1;height:14px;background:var(--panel2);border-radius:7px;overflow:hidden}
  .scores .track>i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--signal));width:0;transition:width .7s}
  .scores .vv{width:42px;text-align:right;color:var(--ink)}

  .verdict{padding:18px;border-radius:12px;font-family:var(--display);font-size:24px;font-weight:700;
    background:rgba(61,220,132,.1);border:1px solid #1f6b45;color:var(--signal);opacity:0;transform:translateY(8px);transition:.5s}
  .verdict.in{opacity:1;transform:none}
  .verdict.edge{background:rgba(255,180,84,.08);border-color:#443;color:var(--amber)}
  .verdict .s{font-family:var(--mono);font-size:12px;color:var(--mute);font-weight:400;margin-top:6px}
  .status{max-width:920px;margin:0 auto;padding:0 24px;color:var(--dim);font-size:12px}
  .spinner{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--signal);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <h1>Sentinel<em>Desk</em></h1>
  <span class="sub">Explain — watch the query light up</span>
  <div class="controls">
    <div class="tabs"><a href="/">Console</a><a href="/hybrid">Hybrid</a><a href="/vocab">Vocabulary</a><a href="/synonyms">Synonyms</a><a href="/learn">Live Learning</a><a href="/correct">Self-Correct</a><a href="/datagen">Data Gen</a><a href="/external">External</a></div>
    <label style="font-size:11px;color:var(--mute)"><input type="checkbox" id="synmode"> synonym compare</label>
    <button class="run" id="go" onclick="run()">▶ Explain</button>
  </div>
</header>
<div class="status" id="status"></div>

<div class="stage">
  <div class="ticketbar">
    <div class="lbl">Query</div>
    <input id="ticket" value="primary replica deadlock, connection pool exhausted overnight">
    <div class="quick" id="quick"></div>
  </div>

  <div class="legend">
    <span><b style="background:var(--blue)"></b>frequent terms</span>
    <span><b style="background:var(--signal)"></b>unique (TF-IDF / n-gram)</span>
    <span><b style="background:var(--amber)"></b>layman → canonical</span>
  </div>
  <div class="canvas" id="canvas"><span class="dim">type a query and hit Explain</span></div>

  <div id="steps"></div>
</div>

<script>
const API=location.origin, $=id=>document.getElementById(id);
const QUICK=[
  ["Confident → Database", "primary replica deadlock, connection pool exhausted overnight"],
  ["Tie → LLM tiebreak", "the internet is down and websites won't load"],
  ["Security → SOC", "ransomware encrypting files on a finance workstation"],
];
const SYN_QUICK=[
  ["casual → Network (vpn)", "can't connect to work from home and the calls keep breaking up"],
  ["casual → Network (dns)", "internet not working, can't reach the site"],
  ["casual → Network (switch)", "ethernet not connecting, no link light on the port"],
];
const qb=$('quick');
function renderQuick(){
  qb.innerHTML='';
  ($('synmode').checked?SYN_QUICK:QUICK).forEach(([label,q])=>{const b=document.createElement('button');b.textContent=label;b.onclick=()=>{$('ticket').value=q;run();};qb.appendChild(b);});
}
$('synmode').addEventListener('change', renderQuick);
renderQuick();

const sleep=ms=>new Promise(r=>setTimeout(r,ms));

function renderWords(text){
  const canvas=$('canvas'); canvas.innerHTML='';
  // tokenize keeping order; map each word to a span
  const words=text.split(/(\s+)/);
  const spans=[];
  words.forEach(tok=>{
    if(/^\s+$/.test(tok)){canvas.appendChild(document.createTextNode(tok));return;}
    const s=document.createElement('span'); s.className='w'; s.textContent=tok;
    s.dataset.key=tok.toLowerCase().replace(/[^a-z0-9\-]/g,'');
    canvas.appendChild(s); spans.push(s);
  });
  return spans;
}

function glow(spans, terms, cls){
  if(!terms||!terms.length) return;
  const set=new Set(terms.map(t=>t.toLowerCase()));
  // single + bigram exact match, plus substring fallback for canonical phrases
  spans.forEach((s,i)=>{
    const k=s.dataset.key;
    if(!k) return;
    if(set.has(k)){ s.classList.add(cls); return; }
    for(const term of set){ if(term.includes(' ')){ // multi-word term: light up each word it contains
        if(term.split(' ').includes(k)) s.classList.add(cls);
      } else if(term.length>3 && (k===term)){ s.classList.add(cls); } }
    if(i<spans.length-1){ const bi=k+' '+spans[i+1].dataset.key;
      if(set.has(bi)){ s.classList.add(cls); spans[i+1].classList.add(cls); } }
  });
}

function panel(html){ const d=document.createElement('div'); d.className='panel'; d.innerHTML=html; $('steps').appendChild(d);
  requestAnimationFrame(()=>requestAnimationFrame(()=>d.classList.add('in'))); return d; }

async function runSynonymCompare(text){
  $('go').disabled=true; $('steps').innerHTML=''; $('canvas').innerHTML=''; $('status').innerHTML='comparing with/without synonyms <span class="spinner"></span>';
  let d;
  try{ d=await (await fetch(API+'/api/synonym_compare',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})})).json(); }
  catch(e){ $('status').innerHTML='<span style="color:var(--red)">backend not running</span>'; $('go').disabled=false; return; }
  $('status').textContent='';
  const spans=renderWords(d.text);
  await sleep(400);
  d.mappings.forEach(m=>{ const words=m.synonym.split(' ');
    spans.forEach((s,i)=>{ if(s.dataset.key===words[0].replace(/[^a-z0-9\-]/g,'')){
      for(let j=0;j<words.length && spans[i+j];j++) spans[i+j].classList.add('layman'); }});
  });
  await sleep(700);
  panel(`<h3>1 · Casual words → canonical terms</h3><div class="b">The ticket uses casual phrasings. Normalization maps each to a canonical term — exactly the TF-IDF / n-gram terms the classifier knows:</div>
    <div style="margin-top:8px">${d.mappings.map(m=>`<div style="margin:4px 0"><span class="chip layman">${m.synonym}</span> <span style="color:var(--dim)">→</span> <span class="chip uniq">${m.canonical}</span> ${m.in_vocab?'<span class="g" style="font-size:10px">✓ in vocabulary</span>':'<span class="dim" style="font-size:10px">(concept)</span>'}</div>`).join('')||'<span class="dim">no casual synonyms detected</span>'}</div>`);
  await sleep(900);
  const w=d.without;
  panel(`<h3>2 · WITHOUT synonyms — raw text scored</h3><div class="b">Evidence: <span class="dim">${w.evidence}</span><br>→ <b class="a">${w.category}</b> (${(w.confidence*100).toFixed(0)}%)${w.edge?' <span class="a">[edge / low confidence]</span>':''}</div>`);
  await sleep(900);
  const wi=d.with;
  panel(`<h3>3 · WITH synonyms — normalized, then scored</h3><div class="b">Normalized: <span class="g">${d.normalized}</span><br>Evidence now: <span class="g">${wi.evidence}</span><br>→ <b class="g">${wi.category}</b> (${(wi.confidence*100).toFixed(0)}%)</div>`);
  await sleep(900);

  // step 4: how those words populate the prompt
  function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  let promptHTML=esc(d.prompt);
  // highlight the evidence line by wrapping the escaped evidence text
  if(d.prompt_evidence){
    const evEsc=esc(d.prompt_evidence);
    promptHTML=promptHTML.replace('Lexical evidence found: '+evEsc,
      'Lexical evidence found: <span class="ev">'+evEsc+'</span>');
  }
  const ambiguous = !d.with_confident;
  panel(`<h3>4 · Those terms get added to the prompt</h3>
    <div class="b">The synonym-derived canonical terms become the evidence the classifier reasons over.
    ${ambiguous?'This ticket is ambiguous, so the LLM tiebreak prompt runs, built from these terms:':'Here the scorer is confident, so it decides directly — no LLM needed. But on an <i>ambiguous</i> ticket, these same terms would populate the tiebreak prompt like this:'}</div>
    <pre>${promptHTML}</pre>
    <div class="b dim">Notice the evidence line — those are the terms the synonyms unlocked. Without normalization it would have read <span class="a">${esc(d.without.evidence)}</span>.</div>`);
  await sleep(1000);

  const v=document.createElement('div'); v.className='verdict';
  v.innerHTML=d.flipped
    ? `✓ Synonyms fixed it: <span style="text-decoration:line-through;opacity:.6">${d.without.category}</span> → ${d.with.category}<span class="s">without normalization it was wrong/uncertain; the synonym layer recovered the correct route</span>`
    : `→ ${d.with.category}<span class="s">${d.changed?'normalization applied':'already canonical — synonym layer dormant here'}; classification consistent</span>`;
  $('steps').appendChild(v); requestAnimationFrame(()=>requestAnimationFrame(()=>v.classList.add('in')));
  v.scrollIntoView({behavior:'smooth',block:'center'}); $('go').disabled=false;
}

let RUN_ID=0;
async function run(){
  if($('synmode').checked) return runSynonymCompare($('ticket').value);
  const myRun=++RUN_ID;                      // new run supersedes any in-flight one
  const alive=()=>myRun===RUN_ID;
  $('go').disabled=true; $('steps').innerHTML=''; $('status').innerHTML='analysing <span class="spinner"></span>';
  const text=$('ticket').value;
  let d;
  try{ d=await (await fetch(API+'/api/explain',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})})).json(); }
  catch(e){ $('status').innerHTML='<span style="color:var(--red)">backend not running — python web/server.py</span>'; $('go').disabled=false; return; }
  $('status').textContent='';

  // show a normalization step first IF it was load-bearing (casual -> canonical)
  if(d.norm_helped){
    panel(`<h3>· Normalization rewrote casual phrasing</h3><div class="b">The query used casual words, so they were rewritten to canonical terms before classifying:<br>
      <span class="k">before:</span> ${d.text}<br><span class="g">after:</span> ${d.normalized}</div>`);
    await sleep(900); if(!alive()) return;
  }

  const spans=renderWords(d.glow_text||d.normalized||text);
  await sleep(500); if(!alive()) return;

  // step 1: frequent words glow
  glow(spans, d.freq_terms, 'freq');
  if(d.freq_terms.length) panel(`<h3>1 · Frequent terms light up</h3><div class="b">Common in-domain words matched: ${d.freq_terms.map(t=>`<span class="chip freq">${t}</span>`).join('')||'—'}</div>`);
  await sleep(900); if(!alive()) return;

  // step 2: unique TF-IDF / n-gram words glow
  glow(spans, d.unique_terms, 'uniq');
  panel(`<h3>2 · Unique TF-IDF / n-gram terms light up</h3><div class="b">The discriminative terms — these decide the domain: ${d.unique_terms.map(t=>`<span class="chip uniq">${t}</span>`).join('')||'<span class="dim">none — low signal</span>'}</div>`);
  await sleep(1000); if(!alive()) return;

  // layman
  if(d.layman_terms.length){ glow(spans, d.layman_terms, 'layman');
    panel(`<h3>· Layman phrasings normalized</h3><div class="b">Casual words mapped to canonical terms: ${d.layman_terms.map(t=>`<span class="chip layman">${t}</span>`).join('')}</div>`);
    await sleep(900); if(!alive()) return;
  }

  // step 3: explanation
  panel(`<h3>3 · Explanation</h3><div class="b">The classifier reads the lit terms and scores each domain. The
    <span class="g">${d.unique_terms.length?d.unique_terms.join(', '):'matched'}</span> signal points to
    <span class="g">${d.category}</span>${d.is_edge_case?` — but it's close (<span class="a">${d.edge_reason||'edge case'}</span>), so it won't decide alone.`:'.'}</div>`);
  await sleep(900); if(!alive()) return;

  // step 4: scores bars
  const sc=panel(`<h3>4 · Deterministic scorer</h3><div class="b">Per-domain score (transparent, auditable):</div><div class="scores" id="scbars"></div>`);
  const max=Math.max(...Object.values(d.scores),1);
  const sb=sc.querySelector('#scbars');
  Object.entries(d.scores).slice(0,5).forEach(([k,v])=>{ const r=document.createElement('div'); r.className='row';
    r.innerHTML=`<span class="nm">${k}</span><span class="track"><i></i></span><span class="vv">${v}</span>`; sb.appendChild(r); });
  await sleep(60); if(!alive()) return; sb.querySelectorAll('i').forEach((bar,idx)=>{ const v=Object.values(d.scores)[idx]; bar.style.width=Math.round(v/max*100)+'%'; });
  await sleep(1000); if(!alive()) return;

  // step 5: path — scorer decides, OR tiebreak prompt on ties
  if(!d.is_edge_case){
    panel(`<h3>5 · Decision (common path)</h3><div class="b">Confident — the deterministic scorer decides. <span class="dim">No LLM needed (this is ~99% of tickets).</span></div>`);
  } else {
    const tb=d.tiebreak||{};
    const promptEsc=(tb.prompt||'').replace(/</g,'&lt;')
        .replace(/Lexical evidence found: (.*)/,'Lexical evidence found: <span class="ev">$1</span>');
    // the model may answer in a sentence; show the matched candidate cleanly
    let choice=tb.llm_choice||'';
    if(choice && tb.candidates){ const hit=tb.candidates.find(c=>choice.toLowerCase().includes(c.toLowerCase())); if(hit) choice=hit; }
    panel(`<h3>5 · It's a tie → the LLM tiebreak prompt runs</h3><div class="b">Voters were close, so the matched evidence is assembled into the tiebreak prompt (used on ~0.3% of tickets):</div>
      <pre>${promptEsc}</pre>
      ${tb.llm_choice?`<div class="b">LLM chose: <span class="g">${choice}</span></div>`:'<div class="b dim">(start Ollama to run the prompt live)</div>'}`);
  }
  await sleep(900); if(!alive()) return;

  // step 6: hybrid retrieval — fetch and show the three rankers fusing for the resolution
  const hp=panel(`<h3>6 · Hybrid retrieval (grounding the fix)</h3><div class="b">For the resolution, three retrievers rank in parallel and fuse — <span class="dim" id="hload">loading the embedding model on first run…</span></div><div id="hbox"></div>`);
  let h=null;
  try{
    const ctrl=new AbortController(); const to=setTimeout(()=>ctrl.abort(),90000);
    h=await (await fetch(API+'/api/hybrid',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,fast:true}),signal:ctrl.signal})).json();
    clearTimeout(to);
  }catch(e){ h={error:String(e)}; }
  const hbox=hp.querySelector('#hbox'); const hload=hp.querySelector('#hload'); if(hload) hload.textContent='';
  if(h && !h.error){
    let html='<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0">';
    const cl=n=>n.startsWith('BM25')?'freq':n.startsWith('Qdrant')?'uniq':'layman';
    for(const [name,items] of Object.entries(h.per_ranker)){
      const short=name.startsWith('BM25')?'BM25 (lexical)':name.startsWith('Qdrant')?'Semantic (BGE/Qdrant)':'Graph RAG';
      html+=`<div style="background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px"><div style="font-family:var(--display);font-size:13px;margin-bottom:6px">${short}</div>`;
      if(!items.length) html+='<div class="dim" style="font-size:11px">— abstains —</div>';
      items.slice(0,2).forEach(i=>{html+=`<div style="font-size:11px;color:var(--mute)"><span class="chip ${cl(name)}">${i.category}</span> <span class="dim">${i.score}</span></div>`;});
      html+='</div>';
    }
    html+='</div>';
    html+=`<div class="b">Reciprocal-rank fusion → <span class="g">${h.category}</span> (${h.confidence})</div>`;
    hp.querySelector('.dim').textContent='';
    hbox.innerHTML=html;
  } else {
    hbox.innerHTML=`<div class="b dim">Hybrid retrieval unavailable right now ${h&&h.error?'('+h.error.slice(0,80)+')':''} — the classification above is unaffected. Run the Hybrid tab directly to see the three retrievers fuse.</div>`;
  }
  await sleep(1000); if(!alive()) return;

  // verdict
  const v=document.createElement('div'); v.className='verdict'+(d.is_edge_case?' edge':'');
  v.innerHTML=`→ ${d.category} <span class="s">${(d.confidence*100).toFixed(0)}% confidence · ${d.path}</span>`;
  $('steps').appendChild(v); requestAnimationFrame(()=>requestAnimationFrame(()=>v.classList.add('in')));
  v.scrollIntoView({behavior:'smooth',block:'center'});
  $('go').disabled=false;
}
fetch(API+'/api/tickets').then(r=>r.json()).then(()=>{$('status').textContent='ready';}).catch(()=>{$('status').innerHTML='<span style="color:var(--red)">backend not running</span>';});
</script>
</body>
</html>
